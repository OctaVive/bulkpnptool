<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Bulk PNP Provisioning Tool{% endblock %}</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #000000;
      }
      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      h1 {
        font-size: 1.9rem;
        margin-bottom: 0.5rem;
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 0;
        margin-bottom: 0.5rem;
      }
      h3 {
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #111827;
        line-height: 1.5;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        border: 1px solid #e5e7eb;
        margin-top: 24px;
      }
      .tab-bar {
        display: flex;
        gap: 8px;
        margin-top: 24px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 0;
      }
      .tab-btn {
        appearance: none;
        border: none;
        background: transparent;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #6b7280;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .tab-btn:hover {
        color: #111827;
      }
      .tab-btn.active {
        color: #e60000;
        border-bottom-color: #e60000;
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #4b5563;
      }
      textarea, select, input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        padding: 10px 12px;
        font-size: 0.95rem;
        background: #ffffff;
        color: #111827;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      textarea:focus, select:focus, input[type="text"]:focus {
        border-color: #e60000;
        box-shadow: 0 0 0 1px rgba(230, 0, 0, 0.25);
        background: #ffffff;
      }
      textarea {
        min-height: 180px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 12px;
      }
      .col {
        flex: 1 1 0;
        min-width: 0;
      }
      .col-1-3 {
        flex: 0 0 33%;
      }
      .helper-text {
        font-size: 0.8rem;
        color: #6b7280;
        margin-top: 4px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 999px;
        border: none;
        background: #e60000;
        color: #ffffff;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        cursor: pointer;
        margin-top: 20px;
        box-shadow: 0 10px 25px rgba(230, 0, 0, 0.35);
        transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
      }
      .btn-primary:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
        box-shadow: 0 14px 35px rgba(230, 0, 0, 0.45);
      }
      .btn-primary:active {
        transform: translateY(0);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #111827;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .btn-secondary:hover {
        border-color: #e60000;
        background: #fff5f5;
      }
      .btn-dark {
        background: #111827;
        color: #ffffff;
        box-shadow: 0 8px 20px rgba(17, 24, 39, 0.25);
      }
      .btn-dark:hover {
        filter: brightness(1.08);
        box-shadow: 0 12px 28px rgba(17, 24, 39, 0.35);
      }
      .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .button-row .btn-primary,
      .button-row .btn-secondary,
      .button-row .btn-dark {
        margin-top: 0;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.85em;
        background: #f3f4f6;
        padding: 2px 5px;
        border-radius: 4px;
        border: 1px solid #e5e7eb;
      }
      .hidden {
        display: none !important;
      }
      .split-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 720px) {
        .split-grid {
          grid-template-columns: 1fr;
        }
      }
      .result-panel {
        border-radius: 10px;
        padding: 16px;
        margin-top: 16px;
      }
      .result-panel-add {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
      }
      .result-panel-del {
        background: #fef2f2;
        border: 1px solid #fecaca;
      }
      .result-panel-warn {
        background: #fffbeb;
        border: 1px solid #fde68a;
      }
      .result-panel-info {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
      }
      .result-list {
        margin: 0;
        padding-left: 1.1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.82rem;
        line-height: 1.6;
      }
      .radio-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .radio-row label.inline {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 500;
        margin-bottom: 0;
      }
      .radio-row input[type="radio"] {
        width: auto;
      }
      .zip-banner {
        background: linear-gradient(135deg, #059669, #0d9488);
        color: #ffffff;
        border-radius: 12px;
        padding: 20px;
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
      }
      .zip-banner p {
        color: #ecfdf5;
        margin: 0;
        font-size: 0.85rem;
        max-width: 560px;
      }
      .zip-banner code {
        background: rgba(0, 0, 0, 0.25);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.8em;
      }
      .zip-banner .btn-secondary {
        background: #ffffff;
        border-color: #ffffff;
        margin-top: 0;
      }
    </style>
    {% block head_scripts %}{% endblock %}
  </head>
  <body>
    <div class="container">
      <header>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:12px;">
            <img src="/assets/Icon-88248495-6083-4dcf-8cb0-1d42d1fb34e3.png" alt="Vodafone logo" style="width:40px;height:40px;border-radius:50%;">
            <div>
              <h1>Provisioning Interface for NGIN Transactions</h1>
              <p>Import file generator for VOF NGIN and ENUM.</p>
            </div>
          </div>
        </div>
      </header>

      <nav class="tab-bar" role="tablist">
        <button type="button" class="tab-btn{% if active_tab == 'provisioning' %} active{% endif %}" data-tab="provisioning" role="tab">Provisioning</button>
        <button type="button" class="tab-btn{% if active_tab == 'splitter' %} active{% endif %}" data-tab="splitter" role="tab">Number Splitter</button>
      </nav>

      {% block content %}{% endblock %}
    </div>

    <script>
      function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
        });
        document.querySelectorAll('.tab-panel').forEach(function (panel) {
          panel.classList.toggle('active', panel.getAttribute('data-tab-panel') === tabName);
        });
        var url = new URL(window.location.href);
        if (tabName === 'splitter') {
          url.searchParams.set('tab', 'splitter');
        } else {
          url.searchParams.delete('tab');
        }
        window.history.replaceState({}, '', url);
      }

      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            switchTab(btn.getAttribute('data-tab'));
          });
        });
      });
    </script>
    {% block body_scripts %}{% endblock %}
  </body>
</html>
